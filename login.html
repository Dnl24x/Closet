<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign in — A doua șansă</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-page">\n\n<div id="languageModal" class="language-modal" hidden role="dialog" aria-modal="true" aria-labelledby="languageModalTitle">\n    <div class="language-modal-card">\n        <p class="eyebrow">A doua șansă</p>\n        <h2 id="languageModalTitle">Pick any language you want.</h2>\n        <p>Always can be changed in settings.</p>\n        <div class="language-options">\n            <button type="button" data-language="en">English</button>\n            <button type="button" data-language="ro">Română</button>\n            <button type="button" data-language="ru">Русский</button>\n        </div>\n    </div>\n</div>

    <header class="site-header">
        <button
            class="logo"
            id="logoButton"
            type="button"
            aria-label="Return to CLOSET home"
        >
            CLOSET
        </button>
    </header>

    <main class="auth-main">
        <section class="auth-card">

            <button
                class="auth-back-button"
                id="backButton"
                type="button"
            >
                ← Back
            </button>

            <div class="auth-heading">
                <p class="eyebrow">WELCOME BACK</p>

                <h1>Sign in.</h1>

                <p>
                    Sign in to manage your profile,
                    listings and CLOSET activity.
                </p>
            </div>

            <form
                id="loginForm"
                class="auth-form"
                novalidate
            >

                <div
                    id="loginFormMessage"
                    class="auth-form-message"
                    role="alert"
                    hidden
                ></div>

                <div class="auth-field">
                    <label for="loginEmail">
                        Email address
                    </label>

                    <input
                        id="loginEmail"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="auth-field">
                    <div class="auth-field-label">
                        <label for="loginPassword">
                            Password
                        </label>
                    </div>

                    <div class="auth-password">
                        <input
                            id="loginPassword"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            id="toggleLoginPassword"
                            class="auth-password-toggle"
                            type="button"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <button
                    id="loginSubmitButton"
                    class="auth-submit"
                    type="submit"
                >
                    Sign in
                </button>
            </form>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <p class="auth-switch">
                Don't have an account?

                <button
                    id="goToSignupButton"
                    type="button"
                >
                    Create an account
                </button>
            </p>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="i18n.js"></script>\n<script src="auth.js"></script>\n<script>document.addEventListener("DOMContentLoaded", () => window.ClosetI18n?.initialize());</script>
    <script src="login.js"></script>

</body>
</html>
